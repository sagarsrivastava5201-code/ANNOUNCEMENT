<!-- ================= BOOKING FORM ================= -->

<div class="booking-area" id="booking">

<div class="booking-card">

<h2>
📢 Booking करें
</h2>

<p>
अपनी जानकारी भरें और Announcement तैयार करवाएं
</p>


<form id="bookingForm">


<!-- Name -->

<div class="input-group">

<label>
👤 Name / नाम
</label>

<input 
type="text"
id="name"
placeholder="अपना नाम लिखें"
required>

</div>



<!-- Mobile -->

<div class="input-group">

<label>
📱 Mobile Number / मोबाइल नंबर
</label>

<input 
type="tel"
id="phone"
placeholder="अपना मोबाइल नंबर डालें"
maxlength="10"
required>

</div>




<!-- City -->

<div class="input-group">

<label>
📍 City / शहर
</label>

<input 
type="text"
id="city"
placeholder="अपना शहर लिखें"
required>

</div>





<!-- Announcement Type -->

<div class="input-group">

<label>
📢 Announcement Type / घोषणा का प्रकार
</label>


<select id="type" required>

<option value="">
चुनें
</option>

<option>
दुकान उद्घाटन
</option>

<option>
नई दुकान / नई शाखा उद्घाटन
</option>

<option>
जन्मदिन की घोषणा
</option>

<option>
विवाह समारोह की घोषणा
</option>

<option>
ऑफर / प्रचार घोषणा
</option>

<option>
स्कूल / कोचिंग प्रचार
</option>

<option>
धार्मिक कार्यक्रम
</option>

<option>
चुनाव प्रचार
</option>

<option>
अन्य
</option>

</select>


</div>





<!-- Message -->

<div class="input-group">

<label>
📝 Message / क्या बोलना है?
</label>


<textarea
id="script"
rows="5"
placeholder="अपना Announcement Message लिखें..."
required></textarea>


</div>





<!-- Delivery -->

<div class="input-group">

<label>
🎧 Delivery / Audio कहाँ चाहिए?
</label>


<select id="delivery">

<option>
WhatsApp पर
</option>

<option>
Memory Card में
</option>

<option>
Shop से लेना है
</option>


</select>


</div>






<button 
type="submit"
class="book-btn">


<i class="fa-brands fa-whatsapp"></i>

Booking करें


</button>



</form>


</div>

</div>
